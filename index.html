<!DOCTYPE html>
<head>


</head>
<style>
  #container {
    width: 600px;
    margin: auto;
    margin-top: 50px;
  }
  textarea {
    width: 600px;
    box-sizing: border-box;
    padding: 20px;
    font-family:'Courier New', Courier, monospace;
    min-height: 300px;
    border: 1px solid #000;
    margin-bottom: 20px;
    font-size: 1.2rem;
  }
  button {
    width: 600px;
    box-sizing: border-box;
    padding: 20px;
    border: 1px solid #000;
    color: #fff;
    border-radius: 0px;
    background-color: #000;
  }
  p {
    text-align: right;
  }
  p::before {
    content: "score: "
  }
</style>
<body>
  <div id="container">
    <p id="score">0</p>
    <h2 id="question"></h2>
    <textarea id="answerField"></textarea>
    <button id="submitAnswer">Submit answer</button>
  </div>
  <script src="main.js"></script>
</body>
